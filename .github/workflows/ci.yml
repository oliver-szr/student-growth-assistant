{
  "name": "Project validation",
  "on": {"pull_request": {}, "push": {"branches": ["main"]}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "ci-${{ github.workflow }}-${{ github.ref }}", "cancel-in-progress": true},
  "jobs": {
    "backend": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {"SGA_AUTO_BACKUP": "0", "SGA_SKIP_IMPORT_BACKUP": "1", "PYTHONUTF8": "1"},
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11", "cache": "pip", "cache-dependency-path": "backend/requirements.txt\nbackend/constraints.txt"}},
        {"name": "Install constrained dependencies", "run": "python -m pip install -r backend/requirements.txt -c backend/constraints.txt"},
        {"name": "Dependency compatibility", "run": "python -m pip check"},
        {"name": "Check repository references and CI definition", "run": "python scripts/check_repository.py"},
        {"name": "Backend regression tests", "working-directory": "backend", "run": "mkdir -p ../scripts/.local\npython -m pytest -q -p no:cacheprovider --basetemp=../scripts/.local/ci-pytest"}
      ]
    },
    "frontend": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-node@v4", "with": {"node-version": "22", "cache": "npm", "cache-dependency-path": "frontend/package-lock.json"}},
        {"name": "Install locked dependencies", "run": "npm --prefix frontend ci"},
        {"name": "Frontend tests", "run": "npm --prefix frontend test"},
        {"name": "Production build", "run": "npm --prefix frontend run build"}
      ]
    }
  }
}
